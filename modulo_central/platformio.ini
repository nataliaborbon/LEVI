; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:onx3248g035]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.embed_txtfiles =
build_flags =
	-DCONFIG_ARDUINO_ISR_IRAM=1
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_OTA_ALLOW_UPDATES=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192*2
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=16
	; --- Pantalla ST7796 (ONX3248G035) con TFT_eSPI; pines según BoardConfig.h del ejemplo oficial ---
	-DUSER_SETUP_LOADED=1
	-DST7796_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MISO=-1
	-DTFT_MOSI=1
	-DTFT_SCLK=5
	-DTFT_CS=2
	-DTFT_DC=3
	; el reset del LCD va por el PCF8574 (P6)
	-DTFT_RST=-1
	-DTFT_BL=6
	-DTFT_BACKLIGHT_ON=HIGH
	; el panel muestra los colores correctos sin inversión (comando INVOFF 0x20)
	-DTFT_INVERSION_OFF
	; en S3 con core 2.x, sin esto TFT_eSPI apunta a un registro SPI invalido
	-DUSE_FSPI_PORT
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DSPI_FREQUENCY=40000000
	-DLV_CONF_INCLUDE_SIMPLE
	-I include/
; Sqlite3Esp32 (siara-cc 2.5) NO va acá: está copiada en lib/Sqlite3Esp32 con un
; arreglo propio en src/esp32.cpp (ESP32FileControl) para que funcionen los PRAGMAs.
lib_deps =
	bodmer/TFT_eSPI @ ^2.5.31
	mathieucarbou/ESPAsyncWebServer @ ^3.3.23
	bblanchon/ArduinoJson@^6.21.0
	adafruit/Adafruit CST8XX Library
	adafruit/Adafruit PCF8574
	lvgl/lvgl@^9.5.0
upload_speed = 460800
